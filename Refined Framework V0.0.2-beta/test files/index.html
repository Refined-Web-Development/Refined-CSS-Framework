
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carousel</title>
  <link rel="stylesheet" href="/test files/styles.css">
</head>
<body>
  <div class="carousel">
    <div class="carousel-container">
      <div class="carousel-item"><img src="/test files/Banners/Early release.png" alt="Image 1"></div>
      <div class="carousel-item"><img src="/test files/Banners/New-Styles-Banner.png" alt="Image 2"></div>
      <div class="carousel-item"><img src="/test files/Banners/valentine’s day shirts.png" alt="Image 3"></div>
      <div class="carousel-item"><img src="/test files/Banners/Winter Break Banner .png" alt="Image 4"></div>
    </div>
    <button class="carousel-control prev">❮</button>
    <button class="carousel-control next">❯</button>
    <div class="carousel-slider-panel">
        <span class="carousel-dot active" data-index="0"></span>
        <span class="carousel-dot" data-index="1"></span>
        <span class="carousel-dot" data-index="2"></span>
        <span class="carousel-dot" data-index="3"></span>
      </div>
  </div>
  <script src="/test files/scripts.js"></script>
</body>
</html>
